[build-system]
requires = ["uv>=0.1.0", "setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RoboDriver"
version = "0.0.3"
description = ""
readme = "README.md"
authors = [
    { name = "Xiang Yang", email = "ryu-yang@qq.com" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.7.1",
    "lerobot-robodriver>=0.4.0",
    # "genesis-world",
    "mujoco",

    # R15/issue #7：代码使用 0.2.x getLogger API，声明与实现一致（原 ==0.1.5 与代码矛盾）
    "logging_mp>=0.2.0,<0.3",
    # issue #7：显式声明运行时依赖（generate-parameter-library / 数据后处理需要）
    "tyro>=0.9.0",
    "typeguard>=4.0",
    "python-socketio",

    "sounddevice",
    "soundfile",

    "rerun-sdk==0.26.2",
]

[project.optional-dependencies]

[project.scripts]
robodriver-run="robodriver.scripts.run:main"
robodriver-sim="robodriver.scripts.sim:main"
robodriver-visual="robodriver.scripts.visual:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["robodriver*"]
exclude = []
